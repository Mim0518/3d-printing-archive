[package]
name = "printing-archive"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }
csv = "1.4.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rand = "0.10.4"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = { version = "0.3", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.1"

[dev-dependencies]
csv = "1.4.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
